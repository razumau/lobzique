# Gems whose use of Nokogiri defines lobzique's API contract (plan.md, phase 1).
#
# Fields:
#   version:    version scanned (and traced, if `suite` is set)
#   source:     git checkout (repo + ref [+ path]) or the packaged gem (default)
#   usage:      runtime | test. Whether the gem's Nokogiri calls run in a
#               production app or only under tests.
#   test_paths: globs inside a runtime gem whose code only runs under tests
#   suite:      command that runs the gem's tests under the recorder
#   ruby:       Ruby for setup and suite (via `mise exec`), when the repo's
#               Ruby (mise.toml) is too old for the gem
#   domain:     html | html-test | xml | debug. What the gem uses Nokogiri for;
#               APIs used only by xml-domain gems are out of scope.
#   why:        reason the gem is a target
#
# Rails components are scanned at the same commit test/fixtures pins.

nokogiri: 1.19.4

tier1:
  actionview:
    version: 8.2.0.alpha
    domain: html
    source: {repo: rails/rails, ref: d5c10191684c845d4ddb53587d3a2965270369fc, path: actionview}
    usage: runtime
    test_paths: [lib/action_view/test_case.rb]
    suite: bin/test
    why: sanitize/strip_tags helpers; ActionView::TestCase
  actiontext:
    version: 8.2.0.alpha
    domain: html
    source: {repo: rails/rails, ref: d5c10191684c845d4ddb53587d3a2965270369fc, path: actiontext}
    usage: runtime
    test_paths: [lib/action_text/system_test_helper.rb]
    suite: bin/test
    why: Fragment, HTML/plain-text/Markdown conversion
  actionpack:
    version: 8.2.0.alpha
    domain: html-test
    source: {repo: rails/rails, ref: d5c10191684c845d4ddb53587d3a2965270369fc, path: actionpack}
    usage: runtime
    test_paths: [lib/action_dispatch/testing/**, lib/action_controller/test_case.rb]
    suite: bin/test
    why: TestResponse#parsed_body, assert_select via rails-dom-testing
  actionmailer:
    version: 8.2.0.alpha
    domain: html-test
    source: {repo: rails/rails, ref: d5c10191684c845d4ddb53587d3a2965270369fc, path: actionmailer}
    usage: runtime
    test_paths: [lib/action_mailer/test_case.rb]
    suite: bin/test
    why: ActionMailer::TestCase DOM assertions
  activesupport:
    version: 8.2.0.alpha
    domain: xml
    source: {repo: rails/rails, ref: d5c10191684c845d4ddb53587d3a2965270369fc, path: activesupport}
    usage: runtime
    suite: bin/test test/xml_mini_test.rb test/xml_mini/nokogiri_engine_test.rb test/xml_mini/nokogirisax_engine_test.rb
    why: optional XmlMini backends (out of scope, recorded to size them)
  activestorage:
    version: 8.2.0.alpha
    domain: html
    source: {repo: rails/rails, ref: d5c10191684c845d4ddb53587d3a2965270369fc, path: activestorage}
    usage: runtime
    why: SVG handling in the vips analyzer
  railties:
    version: 8.2.0.alpha
    domain: html
    source: {repo: rails/rails, ref: d5c10191684c845d4ddb53587d3a2965270369fc, path: railties}
    usage: runtime
    why: dom_testing_default_html_version and sanitizer_vendor configuration
  loofah:
    version: 2.25.2
    domain: html
    source: {repo: flavorjones/loofah, ref: v2.25.2}
    usage: runtime
    suite: bundle exec rake test
    why: what rails-html-sanitizer is built on
  rails-html-sanitizer:
    version: 1.7.1
    domain: html
    source: {repo: rails/rails-html-sanitizer, ref: v1.7.1}
    usage: runtime
    suite: bundle exec rake test
    why: Rails' sanitizer; forces nokogiri into every lockfile
  rails-dom-testing:
    version: 2.3.0
    domain: html-test
    source: {repo: rails/rails-dom-testing, ref: v2.3.0}
    usage: test
    suite: bundle exec rake test
    why: assert_select, assert_dom_equal


[package]
name = "lobzique"
version = "0.1.0"
edition = "2021"
authors = ["Jury Razumau <mail@razumau.net>"]
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
lobzique-core = { path = "../../crates/lobzique-core" }
magnus = { version = "0.8.2", features = ["rb-sys"] }
rb-sys = { version = "0.9", features = ["stable-api-compiled-fallback"] }

[features]
# Runs a full GC before and after every Ruby C API call (see `rake test:gc_stress`).
gc-stress = ["rb-sys/gc-stress"]

[build-dependencies]
rb-sys-env = "0.2.2"

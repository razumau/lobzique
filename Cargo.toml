# This Cargo.toml lets external tools (IDEs) see a Rust project. Add
# the dependencies of the extension to the Cargo.toml in ext/lobzique.

[workspace]
members = ["./crates/lobzique-core", "./ext/lobzique"]
resolver = "2"

[profile.release]
# Keep debug symbols in the release build, so that the final binary is easy
# to debug.
debug = true

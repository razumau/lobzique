name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "cross-gem/*"

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Ruby version comes from .ruby-version; Rust for clippy, which
      # builds the extension's dependencies against Ruby's headers
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          bundler-cache: true
          cargo-cache: true
      - name: Verify test fixtures
        run: script/fetch_fixtures --verify
      - name: Lint
        run: bundle exec rake standard
      # Enforces what code borrowing an arena may call (ext/lobzique/clippy.toml)
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.3'
          - '3.4'
          - '4.0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby & Rust
        uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cargo-cache: true
      - name: Run the tests
        run: bundle exec rake compile test
      - name: Run the nokogiri facade's tests
        run: bundle exec rake test:facade
      - name: Compare with Nokogiri::HTML5
        run: bundle exec ruby -Ilib script/differential
      - name: Compare sanitizing with Rails::HTML5
        run: bundle exec ruby -Ilib script/differential --mode sanitize
      - name: Compare Action Text content with Nokogiri's
        run: bundle exec ruby -Ilib script/differential --mode action_text
      - name: Compare HTML4 decoding with libxml2's
        run: bundle exec ruby -Ilib script/differential --mode html4

  gc-stress:
    name: GC.stress on Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest Ruby in CI: GC internals differ between them
        ruby:
          - '3.3'
          - '4.0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby & Rust
        uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cargo-cache: true
      - name: Run the tests under GC.stress
        run: bundle exec rake test:gc_stress

  miri:
    name: Miri
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # tendril (html5ever's strings) casts integers to pointers
      MIRIFLAGS: -Zmiri-permissive-provenance
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      # The extension crate calls into libruby, which Miri can't run
      - name: Test the core crate under Miri
        run: cargo miri test -p lobzique-core

  asan:
    name: ASan${{ matrix.gc-stress && ' with GC.stress' || '' }}
    strategy:
      fail-fast: false
      matrix:
        gc-stress: [false, true]
    # asan-release (latest stable Ruby built with ASan) is only built for ubuntu-24.04 x64
    runs-on: ubuntu-24.04
    env:
      # An explicit target keeps ASan out of build scripts and proc macros
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
      RUSTFLAGS: -Zsanitizer=address
      # Ruby doesn't free everything at exit
      ASAN_OPTIONS: detect_leaks=0:suppressions=${{ github.workspace }}/.github/asan.supp
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: asan-release
          bundler-cache: true
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Test the core crate
        if: ${{ !matrix.gc-stress }}
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: cargo test -Zbuild-std -p lobzique-core
      - name: Compile the extension
        env:
          RB_SYS_CARGO_PROFILE: dev
          RB_SYS_EXTRA_CARGO_ARGS: -Zbuild-std
        run: bundle exec rake compile
      - name: Run the tests
        if: ${{ !matrix.gc-stress }}
        run: bundle exec rake test
      # A Ruby object freed while Rust still uses it is reported here, not left to crash later
      - name: Run the tests under GC.stress
        if: matrix.gc-stress
        run: bundle exec rake test:stress

  fuzz:
    uses: ./.github/workflows/fuzz.yml
    with:
      seconds: 60

  ci-data:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.fetch.outputs.result }}
    steps:
      - uses: oxidize-rb/actions/fetch-ci-data@v1
        id: fetch
        with:
          supported-ruby-platforms: |
            exclude: ["arm-linux", "x64-mingw32"]
          stable-ruby-versions: |
            exclude: ["head"]

  source-gem:
    name: Build source gem
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [lint, test, gc-stress]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
      # Not `rake build`: it compiles the extension first, which a source gem doesn't ship
      - name: Build gem
        run: gem build lobzique.gemspec
      - uses: actions/upload-artifact@v7
        with:
          name: source-gem
          path: "*.gem"

  cross-gem:
    name: Compile native gem for ${{ matrix.platform }}
    needs: [ci-data, lint, test, gc-stress]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        platform: ${{ fromJSON(needs.ci-data.outputs.result).supported-ruby-platforms }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: oxidize-rb/actions/cross-gem@v1
        id: cross-gem
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: ${{ join(fromJSON(needs.ci-data.outputs.result).stable-ruby-versions, ',') }}
      - uses: actions/upload-artifact@v7
        with:
          name: cross-gem-${{ matrix.platform }}
          path: ${{ steps.cross-gem.outputs.gem-path }}

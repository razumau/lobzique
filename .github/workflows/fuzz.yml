# Fuzzes each target in fuzz/fuzz_targets/ in turn
name: Fuzz
on:
  workflow_call:
    inputs:
      seconds:
        type: number
        required: true
      workers:
        type: number
        default: 1
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target. The job is killed at 6 hours, build and minimization included.
        type: number
        default: 7200
      workers:
        description: Parallel libFuzzer processes (-fork); the runner has 4 vCPUs
        type: number
        default: 4

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    env:
      FUZZ_SECONDS: ${{ inputs.seconds }}
      FUZZ_WORKERS: ${{ inputs.workers }}
      # The prebuilt cargo-fuzz is a musl binary and defaults to its own target, which ASan can't link
      FUZZ_TARGET_TRIPLE: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # Each run starts from the corpus the previous run grew, short or long
      - uses: actions/cache@v6
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-
      - name: Fuzz each target for ${{ env.FUZZ_SECONDS }}s
        # The parser and DOM targets start from the html5lib and WPT inputs (dom
        # reads each as markup with no operations), read-only after the
        # target's own corpus. Seed files are long, so inputs are capped; a slow
        # input fails rather than stalling the run. A target's dictionary is
        # fuzz/<target>.dict.
        run: |
          for target in $(cargo fuzz list); do
            seeds=()
            if [ "$target" = html5 ] || [ "$target" = html5_in_context ] || [ "$target" = dom ]; then
              seeds=(test/fixtures/wpt-parsing/tree-construction test/fixtures/html5lib-tests/tokenizer)
            fi
            dict=()
            if [ -f "fuzz/$target.dict" ]; then
              dict=(-dict="$PWD/fuzz/$target.dict")
            fi
            fork=()
            if [ "$FUZZ_WORKERS" -gt 1 ]; then
              fork=(-fork="$FUZZ_WORKERS")
            fi
            mkdir -p "fuzz/corpus/$target"
            cargo fuzz run --target "$FUZZ_TARGET_TRIPLE" "$target" "fuzz/corpus/$target" "${seeds[@]}" -- \
              -max_total_time="$FUZZ_SECONDS" -max_len=65536 -timeout=10 "${dict[@]}" "${fork[@]}"
          done
      - name: Minimize the corpus
        run: |
          for target in $(cargo fuzz list); do
            cargo fuzz cmin --target "$FUZZ_TARGET_TRIPLE" "$target"
          done
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/

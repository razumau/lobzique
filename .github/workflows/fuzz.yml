# Fuzzes each target in fuzz/fuzz_targets/ in its own job, and the Ruby API (fuzz/ruby/)
name: Fuzz
on:
  workflow_call:
    inputs:
      seconds:
        type: number
        required: true
      workers:
        type: number
        default: 1
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target. Each job is killed at 6 hours, build and minimization included.
        type: number
        default: 7200
      workers:
        description: Parallel libFuzzer processes (-fork); the runner has 4 vCPUs
        type: number
        default: 4

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: list
        run: |
          names=$(cargo metadata --no-deps --manifest-path fuzz/Cargo.toml --format-version 1 |
            jq -c '[.packages[].targets[] | select(.kind == ["bin"]) | .name]')
          echo "names=$names" >> "$GITHUB_OUTPUT"

  # One job per target, so the 6-hour job limit applies to the run
  # of each target.
  fuzz:
    name: Fuzz ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.names) }}
    env:
      FUZZ_SECONDS: ${{ inputs.seconds }}
      FUZZ_WORKERS: ${{ inputs.workers }}
      TARGET: ${{ matrix.target }}
      # The prebuilt cargo-fuzz is a musl binary and defaults to its own target,
      # which ASan cannot link.
      FUZZ_TARGET_TRIPLE: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # Each run starts from the corpus that the previous run grew, short
      # or long. The fallback key restores the corpus that all targets once
      # shared. The corpora of other targets are dropped below, so the saved
      # cache has only this one.
      - uses: actions/cache@v6
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-
            fuzz-corpus-
      - name: Fuzz for ${{ env.FUZZ_SECONDS }}s
        # The parser and DOM targets start from the html5lib and WPT inputs (dom
        # reads each as markup with no operations), read-only after the own
        # corpus of the target. Seed files are long, so inputs have a size cap.
        # A slow input fails and does not stall the run. So does a single
        # allocation of more than 512 MB, well under the 2 GB RSS limit.
        # html5_scaling counts work to catch slowness under the timeout.
        # The dictionary of a target is fuzz/<target>.dict, or the one of html5
        # for html5_scaling.
        run: |
          mkdir -p "fuzz/corpus/$TARGET"
          find fuzz/corpus -mindepth 1 -maxdepth 1 ! -name "$TARGET" -exec rm -rf {} +
          seeds=()
          if [ "$TARGET" = html5 ] || [ "$TARGET" = html5_in_context ] || [ "$TARGET" = html5_round_trip ] || [ "$TARGET" = dom ]; then
            seeds=(test/fixtures/wpt-parsing/tree-construction test/fixtures/html5lib-tests/tokenizer)
          fi
          dict=()
          if [ -f "fuzz/$TARGET.dict" ]; then
            dict=(-dict="$PWD/fuzz/$TARGET.dict")
          elif [ "$TARGET" = html5_scaling ]; then
            dict=(-dict="$PWD/fuzz/html5.dict")
          fi
          fork=()
          if [ "$FUZZ_WORKERS" -gt 1 ]; then
            fork=(-fork="$FUZZ_WORKERS")
          fi
          cargo fuzz run --target "$FUZZ_TARGET_TRIPLE" "$TARGET" "fuzz/corpus/$TARGET" "${seeds[@]}" -- \
            -max_total_time="$FUZZ_SECONDS" -max_len=65536 -timeout=10 -malloc_limit_mb=512 "${dict[@]}" "${fork[@]}"
      - name: Minimize the corpus
        run: cargo fuzz cmin --target "$FUZZ_TARGET_TRIPLE" "$TARGET"
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/

  ruby:
    name: Fuzz the Ruby API
    runs-on: ubuntu-24.04
    env:
      FUZZ_SECONDS: ${{ inputs.seconds }}
      FUZZ_WORKERS: ${{ inputs.workers }}
      BUNDLE_WITH: fuzz
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Ruzzy builds its ASan runtime from clang.
      - name: Install clang's sanitizer runtimes
        run: sudo apt-get update && sudo apt-get install -y libclang-rt-18-dev
      - uses: ruby/setup-ruby@v1
        # The extension of Ruzzy links libFuzzer, so it builds with clang.
        env:
          CC: clang
          CXX: clang++
          LDSHARED: clang -shared
          LDSHAREDXX: clang++ -shared
          MAKE: make --environment-overrides V=1
        with:
          bundler-cache: true
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: actions/cache@v6
        with:
          path: fuzz/corpus/ruby_api
          key: fuzz-ruby-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-ruby-corpus-
      - name: Fuzz for ${{ env.FUZZ_SECONDS }}s
        run: |
          fork=""
          if [ "$FUZZ_WORKERS" -gt 1 ]; then
            fork="-fork=$FUZZ_WORKERS"
          fi
          FUZZOPTS="-max_total_time=$FUZZ_SECONDS $fork" bundle exec rake fuzz:ruby
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-ruby-artifacts
          path: fuzz/artifacts/ruby_api/

# Fuzzes each target in fuzz/fuzz_targets/ in turn, and the Ruby API (fuzz/ruby/)
name: Fuzz
on:
  workflow_call:
    inputs:
      seconds:
        type: number
        required: true
      workers:
        type: number
        default: 1
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target. The job is killed at 6 hours, build and minimization included.
        type: number
        default: 7200
      workers:
        description: Parallel libFuzzer processes (-fork); the runner has 4 vCPUs
        type: number
        default: 4

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    env:
      FUZZ_SECONDS: ${{ inputs.seconds }}
      FUZZ_WORKERS: ${{ inputs.workers }}
      # The prebuilt cargo-fuzz is a musl binary and defaults to its own target, which ASan can't link
      FUZZ_TARGET_TRIPLE: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # Each run starts from the corpus the previous run grew, short or long
      - uses: actions/cache@v6
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-
      - name: Fuzz each target for ${{ env.FUZZ_SECONDS }}s
        # The parser and DOM targets start from the html5lib and WPT inputs (dom
        # reads each as markup with no operations), read-only after the
        # target's own corpus. Seed files are long, so inputs are capped; a slow
        # input fails rather than stalling the run, and so does a single
        # allocation of more than 512 MB, well under the 2 GB RSS limit.
        # html5_scaling counts work to catch slowness under the timeout. A
        # target's dictionary is fuzz/<target>.dict, or html5's for html5_scaling.
        run: |
          for target in $(cargo fuzz list); do
            seeds=()
            if [ "$target" = html5 ] || [ "$target" = html5_in_context ] || [ "$target" = html5_round_trip ] || [ "$target" = dom ]; then
              seeds=(test/fixtures/wpt-parsing/tree-construction test/fixtures/html5lib-tests/tokenizer)
            fi
            dict=()
            if [ -f "fuzz/$target.dict" ]; then
              dict=(-dict="$PWD/fuzz/$target.dict")
            elif [ "$target" = html5_scaling ]; then
              dict=(-dict="$PWD/fuzz/html5.dict")
            fi
            fork=()
            if [ "$FUZZ_WORKERS" -gt 1 ]; then
              fork=(-fork="$FUZZ_WORKERS")
            fi
            mkdir -p "fuzz/corpus/$target"
            cargo fuzz run --target "$FUZZ_TARGET_TRIPLE" "$target" "fuzz/corpus/$target" "${seeds[@]}" -- \
              -max_total_time="$FUZZ_SECONDS" -max_len=65536 -timeout=10 -malloc_limit_mb=512 "${dict[@]}" "${fork[@]}"
          done
      - name: Minimize the corpus
        run: |
          for target in $(cargo fuzz list); do
            cargo fuzz cmin --target "$FUZZ_TARGET_TRIPLE" "$target"
          done
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/

  ruby:
    name: Fuzz the Ruby API
    runs-on: ubuntu-24.04
    env:
      FUZZ_SECONDS: ${{ inputs.seconds }}
      FUZZ_WORKERS: ${{ inputs.workers }}
      BUNDLE_WITH: fuzz
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Ruzzy builds its ASan runtime from clang's
      - name: Install clang's sanitizer runtimes
        run: sudo apt-get update && sudo apt-get install -y libclang-rt-18-dev
      - uses: ruby/setup-ruby@v1
        # Ruzzy's extension links libFuzzer, so it builds with clang
        env:
          CC: clang
          CXX: clang++
          LDSHARED: clang -shared
          LDSHAREDXX: clang++ -shared
          MAKE: make --environment-overrides V=1
        with:
          bundler-cache: true
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: actions/cache@v6
        with:
          path: fuzz/corpus/ruby_api
          key: fuzz-ruby-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-ruby-corpus-
      - name: Fuzz for ${{ env.FUZZ_SECONDS }}s
        run: |
          fork=""
          if [ "$FUZZ_WORKERS" -gt 1 ]; then
            fork="-fork=$FUZZ_WORKERS"
          fi
          FUZZOPTS="-max_total_time=$FUZZ_SECONDS $fork" bundle exec rake fuzz:ruby
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-ruby-artifacts
          path: fuzz/artifacts/ruby_api/

# cargo-deny for the main workspace (`mise run deny`). The fuzz workspace
# is not shipped, so it is not checked.

[graph]
all-features = true

[advisories]
# Vulnerable, unmaintained and unsound crates fail by default. Put an exception
# in `ignore` with the reason.
yanked = "deny"
ignore = []

[licenses]
# Compatible with the MIT license of the gem.
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "deny"
wildcards = "deny"
# The path dependencies of the workspace.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
